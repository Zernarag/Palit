
<ion-tabs>

  <ion-tab-bar slot="bottom" class="palit-tabbar">

    <!-- ========== HOME ========== -->
    <ion-tab-button tab="home" class="palit-tab">
      <ion-icon name="home-outline" class="tab-icon"></ion-icon>
      <ion-label>Home</ion-label>
      <ion-badge color="danger" class="cart-badge" *ngIf="cartCount > 0">
        {{ cartCount > 99 ? '99+' : cartCount }}
      </ion-badge>
    </ion-tab-button>

    <!-- ========== AUCTION ========== -->
    <ion-tab-button tab="auction" class="palit-tab">
      <ion-icon name="hammer-outline" class="tab-icon"></ion-icon>
      <ion-label>Auction</ion-label>
    </ion-tab-button>

    <!-- ========== UPLOAD ========== -->
    <ion-tab-button tab="upload" class="palit-tab">
      <ion-icon name="add-circle-outline" class="tab-icon"></ion-icon>
      <ion-label>Upload</ion-label>
    </ion-tab-button>

    <!-- ========== MESSAGES ========== -->
    <ion-tab-button tab="messages" class="palit-tab">
      <ion-icon name="chatbubble-outline" class="tab-icon"></ion-icon>
      <ion-label>Messages</ion-label>
      <ion-badge color="danger" class="msg-badge" *ngIf="messagesCount > 0">
        {{ messagesCount }}
      </ion-badge>
    </ion-tab-button>

    <!-- ========== PROFILE ========== -->
    <ion-tab-button tab="profile" class="palit-tab">
      <ion-icon name="person-outline" class="tab-icon"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
