<ion-content [fullscreen]="true" class="page-content">

  <div class="topbar bordered">
    <div class="topbar-title">Wishlist</div>
    <span class="small link">{{ items.length }} items</span>
  </div>

  <div class="section">
    <div class="grid2" *ngIf="items.length; else emptyTpl">
      <div class="pcard" *ngFor="let p of items" (click)="openProduct(p.id)">
        <div class="pimg-wrap">
          <img [src]="p.img" [alt]="p.name" loading="lazy">
          <span class="badge pbadge" [ngClass]="p.badge?.cls" *ngIf="p.badge">{{ p.badge.txt }}</span>
          <span class="badge swap-availability-badge" *ngIf="p.swapAvailable"><svg class="icon" aria-hidden="true"><use href="#icon-swap-horizontal"/></svg>For Swap</span>
          <button class="heart" type="button" (click)="onHeart(p.id, $event)"
                  [attr.aria-label]="'Remove ' + p.name + ' from wishlist'">
            <svg class="icon heart-svg"
                 [style.stroke]="isWished(p.id) ? 'var(--guava)' : 'var(--ink-faint)'"
                 [style.fill]="isWished(p.id) ? 'var(--guava)' : 'none'">
              <use href="#icon-heart"/>
            </svg>
          </button>
        </div>
        <div class="pbody">
          <div class="pname">{{ p.name }}</div>
          <div class="row" style="gap: 4px;">
            <span class="stars">{{ starStr(p.rating) }}</span>
            <span class="small faint">{{ p.rating }}</span>
          </div>
          <div class="prow">
            <span class="price-tag">{{ formatPrice(p.price) }}</span>
          </div>
        </div>
      </div>
    </div>

    <ng-template #emptyTpl>
      <div class="empty-state">
        <svg class="empty-svg"><use href="#icon-heart"/></svg>
        <b>Your wishlist is empty</b>
        <div class="small muted">Tap the heart on any product to save it here.</div>
        <button class="btn btn-primary btn-sm empty-cta" (click)="goHome()">Start Shopping</button>
      </div>
    </ng-template>
  </div>
</ion-content>
