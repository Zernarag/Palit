<ion-content [fullscreen]="true" class="page-content">

  <div class="topbar" style="gap: 10px;">
    <button class="iconbtn" (click)="back()" aria-label="Go back">
      <svg class="icon"><use href="#icon-back"/></svg>
    </button>
    <div class="searchbar">
      <svg class="icon"><use href="#icon-search"/></svg>
      <input class="search-input"
             placeholder="Search products"
             [(ngModel)]="query"
             (keydown.enter)="onEnter()">
    </div>
    <button class="iconbtn" aria-label="Voice search">
      <svg class="icon"><use href="#icon-mic"/></svg>
    </button>
  </div>

  <div class="section" style="padding-top: 12px;">
    <div class="row between">
      <h2 class="section-title" style="font-size: 15px;">Recent Searches</h2>
      <span class="link small" (click)="clearRecent()">Clear</span>
    </div>
    <div class="hscroll" style="margin-top: 12px;">
      <div class="chip" *ngFor="let r of recent" (click)="runSearch(r)">{{ r }}</div>
    </div>
  </div>

  <div class="section">
    <h2 class="section-title" style="font-size: 15px;">Trending Searches</h2>
    <div style="margin-top: 12px;">
      <div class="list-row" *ngFor="let t of trending; let i = index" (click)="runSearch(t)">
        <span class="faint">{{ i + 1 }}</span>
        <span style="flex: 1; font-size: 14px;">{{ t }}</span>
        <svg class="icon trend-icon"><use href="#icon-arrow-right"/></svg>
      </div>
    </div>
  </div>
</ion-content>
