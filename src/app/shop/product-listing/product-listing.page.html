<ion-content [fullscreen]="true" class="page-content">

  <div class="topbar bordered">
    <button class="iconbtn" (click)="back()" aria-label="Go back">
      <svg class="icon"><use href="#icon-back"/></svg>
    </button>
    <div class="topbar-title">{{ title }}</div>
    <button class="iconbtn" (click)="goTo('/search')" aria-label="Search">
      <svg class="icon"><use href="#icon-search"/></svg>
    </button>
    <button class="iconbtn" (click)="goTo('/cart')" aria-label="Cart">
      <svg class="icon"><use href="#icon-cart"/></svg>
    </button>
  </div>

  <div class="hscroll chips-row">
    <div class="chip" [class.active]="sort === 'popular'" (click)="setSort('popular')">Popular</div>
    <div class="chip" [class.active]="sort === 'new'"     (click)="setSort('new')">Newest</div>
    <div class="chip" [class.active]="sort === 'low'"     (click)="setSort('low')">Price: Low</div>
    <div class="chip" [class.active]="sort === 'high'"    (click)="setSort('high')">Price: High</div>
    <div class="chip" [class.active]="sort === 'rating'"  (click)="setSort('rating')">Top Rated</div>
  </div>

  <div class="section" style="padding-top: 12px;">
    <div class="grid2" *ngIf="products.length; else emptyTpl">
      <div class="pcard" *ngFor="let p of products" (click)="openProduct(p.id)">
        <div class="pimg-wrap">
          <img [src]="p.img" [alt]="p.name" loading="lazy">
          <span class="badge pbadge" [ngClass]="p.badge?.cls" *ngIf="p.badge">{{ p.badge.txt }}</span>
          <span class="badge swap-availability-badge" *ngIf="p.swapAvailable"><svg class="icon" aria-hidden="true"><use href="#icon-swap-horizontal"/></svg>For Swap</span>
          <button class="heart" (click)="onHeart(p.id, $event)">
            <svg class="icon"
                 style="width: 16px; height: 16px;"
                 [style.stroke]="isWished(p.id) ? 'var(--guava)' : 'var(--ink-faint)'"
                 [style.fill]="isWished(p.id) ? 'var(--guava)' : 'none'">
              <use href="#icon-heart"/>
            </svg>
          </button>
        </div>
        <div class="pbody">
          <div class="pname">
            <span class="mall-tag" *ngIf="p.mall">Mall</span>{{ p.name }}
          </div>
          <div class="row" style="gap: 4px;">
            <span class="stars">{{ starStr(p.rating) }}</span>
            <span class="small faint">{{ p.rating }}</span>
          </div>
          <div class="prow">
            <span class="price-tag">{{ formatPrice(p.price) }}</span>
            <span class="price-old" *ngIf="p.old">{{ formatPrice(p.old) }}</span>
          </div>
          <div class="pmeta">{{ p.sold }} sold</div>
        </div>
      </div>
    </div>

    <ng-template #emptyTpl>
      <div class="empty-state">
        <svg class="empty-svg"><use href="#icon-archive"/></svg>
        <b>No products yet</b>
        <div class="small muted">Check back soon for new arrivals in this category.</div>
      </div>
    </ng-template>
  </div>
</ion-content>
