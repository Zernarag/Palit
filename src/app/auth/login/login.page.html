<div class="page">
  <!-- ============ BANNER ============ -->
  <header class="banner">
    <div class="banner-art">
      <img class="banner-image" src="assets/icon/login-signup.avif" alt="Warehouse filled with parcels" />
    </div>
    <div class="banner-content">
      <h1 class="banner-title">Everything you need right to your door</h1>
      <p class="banner-subtitle">Shop great deals and win auctions near Villasis.</p>
    </div>
  </header>

  <!-- ============ FORM BODY ============ -->
  <form class="body" (ngSubmit)="doLogin()" autocomplete="off">
    <div class="form-group">
      <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
        <path d="m3 7 9 6 9-6"/>
      </svg>
      <input
        id="email"
        class="form-control"
        type="text"
        placeholder="Email Address"
        [(ngModel)]="email"
        name="email"
        required />
    </div>

    <div class="form-group">
      <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="10.5" width="16" height="10" rx="2.5"/>
        <path d="M8 10.5V7a4 4 0 0 1 8 0"/>
      </svg>
      <input
        id="password"
        class="form-control has-toggle"
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Password"
        [(ngModel)]="password"
        name="password"
        required />
      <button
        type="button"
        class="toggle"
        (click)="togglePassword()"
        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
        @if (showPassword) {
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        } @else {
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        }
      </button>
    </div>

    <div class="forgot-password">
      <a routerLink="/forgot-password">Forgot Password</a>
    </div>

    <button type="submit" class="btn-main" [disabled]="submitting">
      {{ submitting ? 'Logging in…' : 'Login' }}
    </button>

    <div class="divider">
      <span>Or continue with</span>
    </div>

    <div class="social-buttons">
      <button type="button" class="btn-social" (click)="loginWith('google')">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" stroke="none" d="M21.35 11.1H12v3.9h5.35a4.6 4.6 0 0 1-2 3v2.5h3.2c1.87-1.72 2.95-4.26 2.95-7.28 0-.73-.06-1.44-.15-2.12z"/>
          <path fill="#34A853" stroke="none" d="M12 22c2.7 0 4.96-.9 6.6-2.43l-3.2-2.5c-.9.6-2.05.95-3.4.95-2.6 0-4.8-1.75-5.6-4.12H3.1v2.6A10 10 0 0 0 12 22z"/>
          <path fill="#FBBC05" stroke="none" d="M6.4 13.9a5.9 5.9 0 0 1 0-3.8V7.5H3.1a10 10 0 0 0 0 9l3.3-2.6z"/>
          <path fill="#EA4335" stroke="none" d="M12 5.9c1.47 0 2.8.5 3.84 1.5l2.86-2.86A10 10 0 0 0 3.1 7.5l3.3 2.6C7.2 7.7 9.4 5.9 12 5.9z"/>
        </svg>
        Google
      </button>

      <button type="button" class="btn-social" (click)="loginWith('facebook')">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#1877F2" stroke="none" d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/>
        </svg>
        Facebook
      </button>
    </div>

    <div class="form-footer">
      Don't have an account? <a routerLink="/signup">Create Account</a>
    </div>
  </form>
</div>
