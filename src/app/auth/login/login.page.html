<div class="page">
  <header class="hero">
    <div class="eyebrow">Welcome back</div>
    <h1 class="h1">Log in to PALIT</h1>
    <p class="muted small subtitle">Deals near Villasis are waiting for you.</p>
  </header>

  <form class="body" (ngSubmit)="doLogin()" autocomplete="off">
    <div class="field">
      <label for="email">Mobile number or email</label>
      <input
        id="email"
        class="input"
        type="text"
        [(ngModel)]="email"
        name="email"
        placeholder=""
        required />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input
          id="password"
          class="input"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          placeholder=""
          required />
        <button
          type="button"
          class="toggle"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
          @if (showPassword) {
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          } @else {
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          }
        </button>
      </div>
    </div>

    <div class="row between mb-5">
      <label class="remember">
        <input type="checkbox" [(ngModel)]="remember" name="remember" />
        <span class="small muted">Remember me</span>
      </label>
      <a class="link small" routerLink="/forgot-password">Forgot password?</a>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="submitting">
      {{ submitting ? 'Logging in…' : 'Log In' }}
    </button>

    <div class="divider-row">
      <span class="line"></span>
      <span class="faint small">or continue with</span>
      <span class="line"></span>
    </div>

    <!-- Stacked social buttons -->
    <div class="social-stack">
      <button type="button" class="btn btn-outline social-btn" (click)="loginWith('google')">
        <svg class="icon-lg" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" stroke="none" d="M21.35 11.1H12v3.9h5.35a4.6 4.6 0 0 1-2 3v2.5h3.2c1.87-1.72 2.95-4.26 2.95-7.28 0-.73-.06-1.44-.15-2.12z"/>
          <path fill="#34A853" stroke="none" d="M12 22c2.7 0 4.96-.9 6.6-2.43l-3.2-2.5c-.9.6-2.05.95-3.4.95-2.6 0-4.8-1.75-5.6-4.12H3.1v2.6A10 10 0 0 0 12 22z"/>
          <path fill="#FBBC05" stroke="none" d="M6.4 13.9a5.9 5.9 0 0 1 0-3.8V7.5H3.1a10 10 0 0 0 0 9l3.3-2.6z"/>
          <path fill="#EA4335" stroke="none" d="M12 5.9c1.47 0 2.8.5 3.84 1.5l2.86-2.86A10 10 0 0 0 3.1 7.5l3.3 2.6C7.2 7.7 9.4 5.9 12 5.9z"/>
        </svg>
        Continue with Google
      </button>

      <button type="button" class="btn btn-outline social-btn" (click)="loginWith('facebook')">
        <svg class="icon-lg" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#1877F2" stroke="none" d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/>
        </svg>
        Continue with Facebook
      </button>
    </div>

    <p class="center small muted mt-6">
      New to Palit? <a class="link" routerLink="/signup">Create an account</a>
    </p>
  </form>
</div>
