<ion-content [fullscreen]="true" class="page-content">

  <div class="topbar bordered">
    <button class="iconbtn" (click)="back()" aria-label="Go back">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
    </button>
    <div class="topbar-title">Reset password</div>
  </div>

  <div class="section" style="padding-top: 20px;">
    <div class="hero-tile">
      <svg class="hero-icon" aria-hidden="true">
        <use href="#icon-key"/>
      </svg>
    </div>

    <h2 class="section-title" style="margin: 14px 0 6px;">Forgot your password?</h2>
    <div class="muted small" style="margin-bottom: 20px;">
      Enter your email or mobile number and we'll send you a reset code.
    </div>

    <div class="field">
      <label>Email or mobile number</label>
      <input class="input" type="text" placeholder="you@email.com" [(ngModel)]="email">
    </div>

    <button class="btn btn-primary" (click)="sendReset()">Send Reset Code</button>
  </div>
</ion-content>
