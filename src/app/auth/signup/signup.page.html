<div class="page">
  <!-- ============ BANNER ============ -->
  <header class="banner">
    <div class="banner-art">
      <img class="banner-image" src="assets/icon/login-signup.avif" alt="Warehouse filled with parcels" />
    </div>
    <div class="banner-content">
      <h1 class="banner-title">Create your account</h1>
      <p class="banner-subtitle">Get fresh groceries delivered straight to you.</p>
    </div>
  </header>

  <!-- ============ FORM BODY ============ -->
  <form class="body" (ngSubmit)="createAccount()" autocomplete="off">
    <div class="form-group">
      <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
        <path d="m3 7 9 6 9-6"/>
      </svg>
      <input
        id="fullName"
        class="form-control"
        type="text"
        placeholder="Full Name"
        [(ngModel)]="fullName"
        name="fullName"
        required />
    </div>

    <div class="form-group">
      <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
        <path d="m3 7 9 6 9-6"/>
      </svg>
      <input
        id="mobile"
        class="form-control"
        type="tel"
        placeholder="Mobile Number"
        [(ngModel)]="mobile"
        name="mobile"
        required />
    </div>

    <div class="form-group">
      <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
        <path d="m3 7 9 6 9-6"/>
      </svg>
      <input
        id="email"
        class="form-control"
        type="email"
        placeholder="Email Address"
        [(ngModel)]="email"
        name="email"
        required />
    </div>

    <div class="form-group">
      <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="10.5" width="16" height="10" rx="2.5"/>
        <path d="M8 10.5V7a4 4 0 0 1 8 0"/>
      </svg>
      <input
        id="password"
        class="form-control"
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Password (Min. 8 characters)"
        [(ngModel)]="password"
        name="password"
        minlength="8"
        required />
      <button
        type="button"
        class="toggle"
        (click)="togglePassword()"
        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
        @if (showPassword) {
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        } @else {
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        }
      </button>
    </div>

    <div class="form-group">
      <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="10.5" width="16" height="10" rx="2.5"/>
        <path d="M8 10.5V7a4 4 0 0 1 8 0"/>
      </svg>
      <input
        id="confirmPw"
        class="form-control"
        [type]="showConfirm ? 'text' : 'password'"
        placeholder="Confirm Password"
        [(ngModel)]="confirmPw"
        name="confirmPw"
        required />
      <button
        type="button"
        class="toggle"
        (click)="toggleConfirmPassword()"
        [attr.aria-label]="showConfirm ? 'Hide confirm password' : 'Show confirm password'">
        @if (showConfirm) {
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        } @else {
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        }
      </button>
    </div>

    <label class="terms small muted">
      <input type="checkbox" [(ngModel)]="agree" name="agree" />
      I agree to the Terms of Service and Privacy Policy
    </label>

    <button type="submit" class="btn-main" [disabled]="!agree || submitting">
      {{ submitting ? 'Creating account…' : 'Create Account' }}
    </button>

    <p class="center small muted mt-5">
      Already have an account? <a class="link" routerLink="/login">Log in</a>
    </p>
  </form>
</div>
