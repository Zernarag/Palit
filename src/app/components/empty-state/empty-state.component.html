<div class="empty-state">

  <div class="empty-tile">
    <svg class="empty-icon" aria-hidden="true">
      <use [attr.href]="'#' + icon"/>
    </svg>
  </div>

  <b class="empty-title">{{ title }}</b>

  <div class="empty-body small muted" *ngIf="body">
    {{ body }}
  </div>

  <button class="btn btn-primary btn-sm empty-cta"
          *ngIf="ctaLabel"
          (click)="onCta()">
    {{ ctaLabel }}
  </button>
</div>
